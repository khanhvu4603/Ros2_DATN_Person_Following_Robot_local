<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Chi tiết Thuật toán: Single-Target Person Following</text>

  <!-- ==================== ZONES ==================== -->

  <!-- INPUT ZONE -->
  <rect x="30" y="80" width="160" height="780" rx="15" fill="#eef2f5" />
  <text x="110" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#555">INPUTS</text>

  <!-- Camera -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="120" height="180" rx="10" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
    <text x="60" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">RGB-D Cam</text>
    <text x="60" y="50" font-size="12" text-anchor="middle" fill="#666">RealSense D455</text>
    <line x1="10" y1="60" x2="110" y2="60" stroke="#eee" stroke-width="1"/>
    <text x="60" y="80" font-size="11" text-anchor="middle" fill="#555">RGB: 640x480</text>
    <text x="60" y="100" font-size="11" text-anchor="middle" fill="#555">Depth: 640x480</text>
    <text x="60" y="120" font-size="11" text-anchor="middle" fill="#555">FPS: 30</text>
    <text x="60" y="140" font-size="11" text-anchor="middle" fill="#555">Aligned</text>
  </g>

  <!-- LiDAR -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
    <text x="60" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">2D LiDAR</text>
    <text x="60" y="50" font-size="12" text-anchor="middle" fill="#666">RPLiDAR</text>
    <line x1="10" y1="60" x2="110" y2="60" stroke="#eee" stroke-width="1"/>
    <text x="60" y="80" font-size="11" text-anchor="middle" fill="#555">Range: 12m</text>
    <text x="60" y="100" font-size="11" text-anchor="middle" fill="#555">360° Scan</text>
  </g>

  <!-- ==================== PROCESSING ZONES ==================== -->

  <!-- 1. VISION and RE-ID (BLUE) -->
  <rect x="220" y="80" width="700" height="280" rx="15" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="110" font-size="16" font-weight="bold" fill="#1565c0">1. Vision and Re-ID (Feature Fusion)</text>

  <!-- Detection -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="160" height="180" rx="10" fill="#fff" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Detection</text>
    <line x1="10" y1="40" x2="150" y2="40" stroke="#eee" stroke-width="1"/>
    <text x="80" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565c0">MobileNet-SSD</text>
    <text x="80" y="80" font-size="11" text-anchor="middle" fill="#555">Caffe Model</text>
    <text x="80" y="100" font-size="11" text-anchor="middle" fill="#555">Conf &gt; 0.5</text>
    
    <rect x="20" y="120" width="120" height="40" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
    <text x="80" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565c0">Depth Pre-Filter</text>
  </g>

  <!-- Feature Extraction -->
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="220" height="180" rx="10" fill="#fff" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Multi-Feature Extraction</text>
    <line x1="10" y1="40" x2="210" y2="40" stroke="#eee" stroke-width="1"/>
    
    <!-- Shape -->
    <rect x="10" y="50" width="200" height="30" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="110" y="70" font-size="11" text-anchor="middle" fill="#333">Shape: MobileNetV2 (1280-D)</text>
    
    <!-- Color -->
    <rect x="10" y="90" width="200" height="30" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="110" y="110" font-size="11" text-anchor="middle" fill="#333">Color: HSV Hist (48-D)</text>
    
    <!-- Depth -->
    <rect x="10" y="130" width="200" height="30" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="110" y="150" font-size="11" text-anchor="middle" fill="#333">Depth: Grid Map (256-D)</text>
  </g>

  <!-- Fusion -->
  <g transform="translate(710, 140)">
    <rect x="0" y="0" width="180" height="180" rx="10" fill="#fff" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Feature Fusion</text>
    <line x1="10" y1="40" x2="170" y2="40" stroke="#eee" stroke-width="1"/>
    
    <text x="90" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565c0">Concatenation</text>
    <text x="90" y="90" font-size="11" text-anchor="middle" fill="#555">Shape + Color + Depth</text>
    
    <path d="M90,100 L90,120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="90" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565c0">L2 Normalization</text>
    <text x="90" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#d84315">Vector 1584-D</text>
  </g>

  <!-- 2. TRACKING and STATE (ORANGE) -->
  <rect x="220" y="380" width="700" height="300" rx="15" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="240" y="410" font-size="16" font-weight="bold" fill="#e65100">2. DeepSORT Tracking and State Machine</text>

  <!-- Kalman -->
  <g transform="translate(250, 440)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Kalman Filter</text>
    <line x1="10" y1="40" x2="170" y2="40" stroke="#eee" stroke-width="1"/>
    
    <text x="90" y="60" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">8-State Vector</text>
    <text x="90" y="80" font-size="10" text-anchor="middle" fill="#555">[x, y, a, h, vx, vy, va, vh]</text>
    
    <rect x="20" y="100" width="140" height="80" rx="5" fill="#fff3e0" stroke="#fb8c00" stroke-width="1"/>
    <text x="90" y="120" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">Motion Adaptive</text>
    <text x="90" y="140" font-size="10" text-anchor="middle" fill="#555">Detect Sudden Stop</text>
    <text x="90" y="160" font-size="10" text-anchor="middle" fill="#555">Reset Velocity</text>
  </g>

  <!-- Matching -->
  <g transform="translate(450, 440)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Matching Cascade</text>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#eee" stroke-width="1"/>
    
    <text x="100" y="60" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">Cost Function</text>
    <text x="100" y="80" font-size="10" text-anchor="middle" fill="#555">0.85*Cos + 0.15*IoU</text>
    
    <text x="100" y="110" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">Gating</text>
    <text x="100" y="130" font-size="10" text-anchor="middle" fill="#555">Mahalanobis Dist &lt; 9.48</text>
    
    <text x="100" y="160" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">Anti-Switching</text>
    <text x="100" y="180" font-size="10" text-anchor="middle" fill="#555">Anchor Feature Check</text>
  </g>

  <!-- FSM -->
  <g transform="translate(670, 440)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Occlusion-Aware FSM</text>
    <line x1="10" y1="40" x2="210" y2="40" stroke="#eee" stroke-width="1"/>
    
    <!-- States -->
    <circle cx="50" cy="80" r="25" fill="#e65100" fill-opacity="0.1" stroke="#e65100" stroke-width="2"/>
    <text x="50" y="84" font-size="9" font-weight="bold" text-anchor="middle">LOCKED</text>
    
    <circle cx="110" cy="150" r="25" fill="#e65100" fill-opacity="0.1" stroke="#e65100" stroke-width="2"/>
    <text x="110" y="154" font-size="9" font-weight="bold" text-anchor="middle">OCCLUDED</text>
    
    <circle cx="170" cy="80" r="25" fill="#e65100" fill-opacity="0.1" stroke="#e65100" stroke-width="2"/>
    <text x="170" y="84" font-size="9" font-weight="bold" text-anchor="middle">RECOVER</text>
    
    <!-- Transitions -->
    <path d="M75,80 L145,80" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M65,100 L95,135" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M125,135 L155,100" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
    
    <text x="110" y="190" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Depth Jump -> Occluded</text>
  </g>

  <!-- 3. SAFETY and CONTROL (GREEN) -->
  <rect x="220" y="700" width="700" height="160" rx="15" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="240" y="730" font-size="16" font-weight="bold" fill="#2e7d32">3. Safety and Control</text>

  <!-- Obstacle -->
  <g transform="translate(250, 740)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#fff" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Obstacle Avoidance</text>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#eee" stroke-width="1"/>
    
    <text x="100" y="60" font-size="11" text-anchor="middle" fill="#333">Sector Check (Front/Side)</text>
    <text x="100" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">Person Masking</text>
    <text x="100" y="95" font-size="10" text-anchor="middle" fill="#555">Radius &lt; 0.4m</text>
  </g>

  <!-- Controller -->
  <g transform="translate(480, 740)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#fff" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">PID Controller</text>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#eee" stroke-width="1"/>
    
    <text x="100" y="60" font-size="11" text-anchor="middle" fill="#333">Heading: P-Control</text>
    <text x="100" y="80" font-size="11" text-anchor="middle" fill="#333">Distance: P + EMA Filter</text>
    <text x="100" y="95" font-size="10" text-anchor="middle" fill="#555">Center-First Policy</text>
  </g>

  <!-- OUTPUT ZONE -->
  <rect x="950" y="80" width="200" height="780" rx="15" fill="#eef2f5" />
  <text x="1050" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#555">OUTPUT</text>

  <!-- Velocity -->
  <g transform="translate(970, 400)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="40" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Robot Cmd</text>
    <line x1="20" y1="50" x2="140" y2="50" stroke="#eee" stroke-width="1"/>
    <text x="80" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#d84315">/cmd_vel</text>
    <text x="80" y="95" font-size="12" text-anchor="middle" fill="#555">Linear X, Angular Z</text>
  </g>

  <!-- Debug -->
  <g transform="translate(970, 600)">
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Debug Stream</text>
    <text x="80" y="55" font-size="12" text-anchor="middle" fill="#555">UDP / Web View</text>
  </g>

  <!-- ==================== CONNECTIONS ==================== -->
  
  <!-- Cam -> Detection -->
  <path d="M170,230 L250,230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Detection -> Feature -->
  <path d="M410,230 L450,230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Feature -> Fusion -->
  <path d="M670,230 L710,230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Fusion -> Matching (Long Path) -->
  <path d="M800,320 L800,350 L550,350 L550,440" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Kalman -> Matching -->
  <path d="M430,540 L450,540" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Matching -> FSM -->
  <path d="M650,540 L670,540" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- FSM -> Control -->
  <path d="M780,640 L780,670 L580,670 L580,740" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- LiDAR -> Obstacle -->
  <path d="M170,610 L220,610 L220,790 L250,790" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Obstacle -> Control -->
  <path d="M450,790 L480,790" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Control -> Output -->
  <path d="M680,790 L920,790 L920,460 L970,460" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

</svg>
